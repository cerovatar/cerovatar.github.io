<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeoTime Foto Mark</title>
    <style>
        :root {
            --primary: #00ffcc;
            --bg: #121212;
            --surface: #1e1e1e;
            --text: #ffffff;
            --danger: #ff4757;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header {
            padding: 1rem; background: var(--surface); display: flex; justify-content: space-between; align-items: center; z-index: 10;
            border-bottom: 1px solid #333;
        }
        .logo { font-weight: bold; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); }
        .status-dot.active { background: var(--primary); box-shadow: 0 0 8px var(--primary); }

        main { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: #000; }

        video { width: 100%; height: 100%; object-fit: cover; display: none; }

        .camera-placeholder {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px; z-index: 1;
        }
        .camera-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
        .error-msg { color: var(--danger); font-weight: bold; margin-bottom: 10px; }
        .info-msg { color: #aaa; font-size: 0.9rem; max-width: 400px; line-height: 1.5; }

        canvas { display: none; }

        /* HUD Overlay — tampilan jam & lokasi di layar */
        .camera-overlay {
            position: absolute; bottom: 30px; left: 20px; right: 20px; pointer-events: none; z-index: 5;
            display: flex; flex-direction: column; align-items: flex-start;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }
        .hud-time {
            font-size: 1.8rem; font-weight: 700; color: #fff; background: rgba(0,0,0,0.5);
            padding: 6px 16px; border-radius: 30px; backdrop-filter: blur(4px);
            border-left: 4px solid var(--primary);
            margin-bottom: 6px;
        }
        .hud-location {
            font-size: 0.9rem; color: #ddd; background: rgba(0,0,0,0.5);
            padding: 6px 16px; border-radius: 30px; backdrop-filter: blur(4px);
            max-width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls {
            background: var(--surface); padding: 20px; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10;
        }
        .btn-shutter {
            width: 70px; height: 70px; border-radius: 50%; border: 4px solid white; background: transparent; position: relative; padding: 0;
        }
        .btn-shutter::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 54px; height: 54px; background: white; border-radius: 50%; transition: 0.2s;
        }
        .btn-shutter:active::after { background: var(--primary); }
        .btn-shutter:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn { border: none; outline: none; cursor: pointer; background: #333; color: white; padding: 10px 18px; border-radius: 8px; font-weight: 600; }
        .btn-retry { background: var(--primary); color: #000; display: none; }

        .flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 20;
        }

        /* Modal Preview */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92);
            z-index: 50; display: none; flex-direction: column; justify-content: center; align-items: center;
        }
        .modal.open { display: flex; }
        .modal img { max-width: 90%; max-height: 70vh; border-radius: 8px; box-shadow: 0 0 30px var(--primary); margin-bottom: 20px; }
        .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .btn-save { background: var(--primary); color: #000; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; }
        .btn-close { background: #333; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        @media (max-width: 600px) {
            .hud-time { font-size: 1.2rem; padding: 4px 12px; }
            .hud-location { font-size: 0.75rem; padding: 4px 12px; max-width: 95%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>📸</span> GeoTime Mark</div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 0.8rem;">
            <span id="cam-status">Kamera Off</span>
            <div class="status-dot" id="cam-dot"></div>
        </div>
    </header>

    <main>
        <div class="camera-placeholder" id="placeholder">
            <div class="camera-icon">📷</div>
            <div id="error-display" class="error-msg"></div>
            <div id="info-display" class="info-msg">Menunggu inisialisasi kamera...</div>
            <button class="btn btn-retry" id="btn-retry-cam" onclick="startCamera()">Coba Lagi</button>
        </div>

        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div class="flash" id="flash"></div>

        <!-- HUD Overlay -->
        <div class="camera-overlay" id="hud" style="display:none;">
            <div class="hud-time" id="hud-clock">--:--:--</div>
            <div class="hud-location" id="hud-location">📍 Mencari lokasi...</div>
        </div>
    </main>

    <div class="controls">
        <button class="btn-shutter" id="shutter-btn" disabled></button>
    </div>

    <!-- Modal Preview -->
    <div class="modal" id="modal">
        <img id="preview-img" alt="Hasil">
        <div class="modal-actions">
            <button class="btn-close" onclick="closeModal()">Tutup</button>
            <a id="dl-link" class="btn-save">⬇️ Simpan Foto</a>
        </div>
    </div>

    <script>
        // ============ DOM ============
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const shutterBtn = document.getElementById('shutter-btn');
        const placeholder = document.getElementById('placeholder');
        const errorDisplay = document.getElementById('error-display');
        const infoDisplay = document.getElementById('info-display');
        const hud = document.getElementById('hud');
        const btnRetryCam = document.getElementById('btn-retry-cam');
        const camDot = document.getElementById('cam-dot');
        const camStatus = document.getElementById('cam-status');
        const hudClock = document.getElementById('hud-clock');
        const hudLocation = document.getElementById('hud-location');

        let stream = null;
        let currentPos = null;
        let currentAddress = 'Mencari alamat...';

        // ============ KAMERA ============
        async function startCamera() {
            placeholder.style.display = 'flex';
            video.style.display = 'none';
            hud.style.display = 'none';
            shutterBtn.disabled = true;
            errorDisplay.innerText = '';
            infoDisplay.innerText = 'Meminta akses kamera...';
            btnRetryCam.style.display = 'none';

            if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                showError("Keamanan Browser", "Kamera tidak bisa diakses karena bukan HTTPS.<br>Gunakan localhost atau hosting dengan HTTPS.");
                return;
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showError("Browser Tidak Support", "Browser Anda tidak mendukung API MediaDevices.");
                return;
            }

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    placeholder.style.display = 'none';
                    video.style.display = 'block';
                    hud.style.display = 'block';
                    shutterBtn.disabled = false;
                    camDot.classList.add('active');
                    camStatus.innerText = "Live";
                    initGeo();
                };
            } catch (err) {
                console.error(err);
                handleCameraError(err);
            }
        }

        function handleCameraError(err) {
            let msg = '';
            if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')
                msg = 'Anda menolak akses kamera. Refresh dan izinkan.';
            else if (err.name === 'NotFoundError')
                msg = 'Tidak ada kamera terdeteksi.';
            else if (err.name === 'NotReadableError')
                msg = 'Kamera digunakan aplikasi lain. Tutup Zoom/Meet.';
            else
                msg = err.message;
            showError('Error Kamera', msg);
        }

        function showError(title, msg) {
            placeholder.style.display = 'flex';
            video.style.display = 'none';
            errorDisplay.innerText = title;
            infoDisplay.innerHTML = msg;
            btnRetryCam.style.display = 'inline-block';
            camDot.classList.remove('active');
            camStatus.innerText = "Error";
        }

        // ============ GPS & ALAMAT LENGKAP ============
        function initGeo() {
            if (!navigator.geolocation) {
                hudLocation.innerText = '⚠️ GPS tidak didukung.';
                return;
            }
            navigator.geolocation.watchPosition(async (pos) => {
                currentPos = pos;
                const { latitude, longitude } = pos.coords;
                // Update HUD lokasi dengan alamat lengkap
                try {
                    const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&addressdetails=1&zoom=18`);
                    const data = await resp.json();
                    if (data.display_name) {
                        currentAddress = data.display_name; // alamat lengkap tanpa potongan
                        hudLocation.innerText = `📍 ${currentAddress}`;
                    } else {
                        hudLocation.innerText = `📍 ${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
                    }
                } catch (e) {
                    hudLocation.innerText = `📍 ${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
                }
            }, (e) => {
                hudLocation.innerText = '⚠️ Gagal dapat lokasi.';
            }, { enableHighAccuracy: true, timeout: 10000 });
        }

        // ============ JAM REAL-TIME ============
        function updateClock() {
            const now = new Date();
            const hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][now.getDay()];
            const tgl = now.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
            const jam = now.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
            hudClock.innerText = `${hari}, ${tgl}  •  ${jam}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ============ AMBIL FOTO ============
        shutterBtn.onclick = () => {
            if (!currentPos) {
                alert('Tunggu sampai lokasi terdeteksi (tulisan lokasi muncul di layar).');
                return;
            }

            // Flash
            const flash = document.getElementById('flash');
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 120);

            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);

            // ---- Watermark ----
            const pad = 30;
            const boxH = 140;
            const w = canvas.width, h = canvas.height;

            // Background transparan di bawah
            ctx.fillStyle = 'rgba(0,0,0,0.65)';
            ctx.fillRect(0, h - boxH, w, boxH);

            // Garis aksen atas
            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(0, h - boxH, w, 4);

            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';

            // ---------- KIRI BAWAH: Tanggal + Hari ----------
            const now = new Date();
            const hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][now.getDay()];
            const tglStr = now.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
            const jamStr = now.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
            const dateTime = `${hari}, ${tglStr}  •  ${jamStr} WIB`;

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 32px Segoe UI, sans-serif';
            ctx.fillText(dateTime, pad, h - boxH + 16);

            // ---------- LOKASI LENGKAP (di bawah tanggal) ----------
            const alamat = currentAddress || 'Alamat tidak tersedia';
            ctx.font = '24px Segoe UI, sans-serif';
            ctx.fillStyle = '#dddddd';
            // Batasi panjang agar tidak terlalu ke kanan (wrap manual jika perlu)
            let addrText = alamat;
            if (addrText.length > 70) {
                // Potong kata agar tidak overflow (opsional, tapi kita tampilkan full di 2 baris)
                const mid = addrText.indexOf(',', 50);
                if (mid > 0 && mid < 100) {
                    ctx.fillText(addrText.substring(0, mid+1), pad, h - boxH + 68);
                    ctx.fillText(addrText.substring(mid+1).trim(), pad, h - boxH + 100);
                } else {
                    // fallback
                    ctx.fillText(addrText, pad, h - boxH + 68);
                }
            } else {
                ctx.fillText(addrText, pad, h - boxH + 68);
            }

            // ---------- KOORDINAT (opsional, kecil di pojok kanan bawah) ----------
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            ctx.font = '18px monospace';
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            const coord = `${currentPos.coords.latitude.toFixed(6)}, ${currentPos.coords.longitude.toFixed(6)}`;
            ctx.fillText(coord, w - pad, h - pad);

            // Tampilkan modal
            const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
            document.getElementById('preview-img').src = dataUrl;
            const dl = document.getElementById('dl-link');
            dl.href = dataUrl;
            dl.download = `GeoTime_${Date.now()}.jpg`;
            document.getElementById('modal').classList.add('open');
        };

        function closeModal() {
            document.getElementById('modal').classList.remove('open');
        }

        // ============ START ============
        window.onload = startCamera;
    </script>
</body>
</html>
